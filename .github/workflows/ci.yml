name: Alpha checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Zig
        run: python3 scripts/install-tool.py zig >> "$GITHUB_PATH"
      - run: zig fmt --check build.zig src
      - run: make test build
      - name: Check CLI version
        run: zig-out/bin/tailor --version
      - name: Package and smoke-test the native release executable
        run: python3 scripts/release.py --native

  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Zig
        run: python3 scripts/install-tool.py zig >> "$GITHUB_PATH"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: make examples
      - name: Clean up services
        if: always()
        run: make examples-stop

  scanner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        scanner: [trivy, grype, osv]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned tools
        run: |
          python3 scripts/install-tool.py zig >> "$GITHUB_PATH"
          python3 scripts/install-tool.py '${{ matrix.scanner }}' >> "$GITHUB_PATH"
          if [ '${{ matrix.scanner }}' = grype ]; then
            python3 scripts/install-tool.py syft >> "$GITHUB_PATH"
          fi
      - run: make scanner-integration SCANNER=${{ matrix.scanner }}
      - name: Retain real scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanner-evidence-${{ matrix.scanner }}-${{ matrix.os }}
          path: .tailor-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Zig
        run: python3 scripts/install-tool.py zig >> "$GITHUB_PATH"
      - run: make compatibility
      - name: Retain native dependency results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ matrix.os }}
          path: |
            .tailor-reports/compatibility-*.json
            zig-out/compatibility/*/*explanation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Zig
        run: python3 scripts/install-tool.py zig >> "$GITHUB_PATH"
      - run: make fuzz FUZZ_ITERATIONS=10000

  release-archives:
    needs: [test, examples, scanner, compatibility, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Zig
        run: python3 scripts/install-tool.py zig >> "$GITHUB_PATH"
      - run: make release
      - name: Verify checksums
        working-directory: zig-out/release
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tailor-alpha-release
          path: zig-out/release/
          if-no-files-found: error
          retention-days: 14
